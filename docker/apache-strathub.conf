# Configuração do Apache para o Valorant StratHub.

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Toda URL que não corresponda a um arquivo existente vai para o front
    # controller. O caminho chega como ?path=... — a mesma forma usada pelo
    # rewrite da Vercel, então o roteador funciona igual nos dois ambientes.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ /index.php?path=$1 [QSA,L]
</Directory>

# Defesa em profundidade: mesmo que algo fora de public/ acabe acessível, estes
# arquivos ficam bloqueados.
<FilesMatch "^\.env|composer\.(json|lock)$|\.(sqlite|sql|md|mjs)$">
    Require all denied
</FilesMatch>

# Assets versionados podem ser cacheados agressivamente.
<LocationMatch "^/(CSS|JS|assets|fonts|vendor)/">
    Header set Cache-Control "public, max-age=31536000"
</LocationMatch>

ServerTokens Prod
ServerSignature Off

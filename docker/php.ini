; Configuração do PHP para o Valorant StratHub.

; --- Uploads ---------------------------------------------------------------
; Precisa acomodar o limite de 100 MB de vídeo da aplicação; com um valor menor
; o PHP recusa o arquivo antes de o código conseguir explicar o motivo.
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 4

; Envio de vídeo grande em conexão lenta.
max_execution_time = 120
memory_limit = 256M

; --- Erros ------------------------------------------------------------------
; Nunca imprimir erro na resposta: o stack trace revela caminhos e credenciais.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; --- Sessão -----------------------------------------------------------------
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.sid_length = 48
session.sid_bits_per_character = 6

; --- Diversos ---------------------------------------------------------------
; Não anunciar a versão do PHP no header Server.
expose_php = Off

; OPcache: compila uma vez e reaproveita entre requisições.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
